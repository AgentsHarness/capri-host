name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fe_ref:
        description: 'capri-fe 要构建的 ref，默认 main'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend (capri-fe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout capri-fe
        uses: actions/checkout@v5
        with:
          repository: AgentsHarness/capri-fe
          ref: ${{ inputs.fe_ref || 'main' }}
          path: capri-fe

      # capri-fe 的 package.json 声明了 packageManager: pnpm@<版本>，
      # action-setup 会自动读取该字段，无需在此重复固定版本。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: capri-fe/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: capri-fe/pnpm-lock.yaml

      - name: Install deps
        working-directory: capri-fe
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: capri-fe
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: capri-fe-dist
          path: capri-fe/dist

  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # internal/server/web/dist 被 .gitignore 忽略、不在仓库里，
      # 必须先把前端构建产物放进去，go:embed web/dist 才能编译。
      - name: Install frontend dist into embed dir
        uses: actions/download-artifact@v7
        with:
          name: capri-fe-dist
          path: internal/server/web/dist

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build Capri-host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/AgentsHarness/capri-host/internal/acp.Version=${GITHUB_REF_NAME}" -o "dist/Capri-host-${GOOS}-${GOARCH}" ./cmd/capri-host

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Capri-host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/Capri-host-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # Windows ships one folder holding two processes, the same shape as
  # Capri.app on macOS: Capri.exe is the double-clicked supervisor that owns
  # the tray icon, the dialogs and the host's lifetime, and bin/Capri-host.exe
  # is the engine it starts. They travel together because Capri.exe looks for
  # the engine in its own bin/.
  windows-exes:
    name: Windows app (${{ matrix.goarch }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install frontend dist into embed dir
        uses: actions/download-artifact@v7
        with:
          name: capri-fe-dist
          path: internal/server/web/dist

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # The manifest and file icon are generated here, per architecture, instead
      # of being committed as a .syso: a checked-in object file only applies to
      # the arch in its file name, which is exactly how an arm64 build ends up
      # silently shipping without one.
      - name: Build Capri.exe + bin/Capri-host.exe (manifest and icon embedded)
        env:
          VERSION: ${{ github.ref_name }}
          OUT: dist/win
        run: bash packaging/windows/make-exes.sh ${{ matrix.goarch }}

      - name: Package zip
        run: |
          # Zip the Capri folder itself, not its contents: unzipping then gives
          # the user one directory to open rather than loose files wherever
          # they happened to extract.
          cd dist/win/${{ matrix.goarch }}
          zip -r "../../Capri-windows-${{ matrix.goarch }}.zip" Capri
          cd ../..
          rm -rf win

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Capri-windows-${{ matrix.goarch }}
          path: dist/Capri-windows-${{ matrix.goarch }}.zip
          if-no-files-found: error

  macos-app:
    name: macOS app
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install frontend dist into embed dir
        uses: actions/download-artifact@v7
        with:
          name: capri-fe-dist
          path: internal/server/web/dist

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build Capri.app
        env:
          VERSION: ${{ github.ref_name }}
        run: bash packaging/macos/make-app.sh --universal

      - name: Build dmg
        run: bash packaging/macos/make-dmg.sh

      - name: Upload app zip
        uses: actions/upload-artifact@v6
        with:
          name: Capri-macos-app
          path: |
            dist/Capri-macos.zip
            dist/Capri-macos.dmg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, windows-exes, macos-app]
    runs-on: ubuntu-latest
    steps:
      # 只下载编译出的二进制，不要包含前端 dist（capri-fe-dist）
      # merge-multiple 让它们平铺到 dist/，再整体上传。
      - name: Download compiled binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: Capri-host-*
          merge-multiple: true

      - name: Download Windows packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: Capri-windows-*
          merge-multiple: true

      - name: Download macOS app
        uses: actions/download-artifact@v7
        with:
          name: Capri-macos-app
          path: dist

      - name: Show built files
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Capri-host ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
