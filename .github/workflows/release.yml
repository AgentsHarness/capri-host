name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      fe_ref:
        description: 'capri-fe 要构建的 ref，默认 main'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend (capri-fe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout capri-fe
        uses: actions/checkout@v5
        with:
          # Same GitHub owner as this repo: a fork builds that owner's
          # capri-fe, upstream still builds AgentsHarness/capri-fe.
          repository: ${{ github.repository_owner }}/capri-fe
          ref: ${{ inputs.fe_ref || 'main' }}
          path: capri-fe

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: capri-fe/package-lock.json

      - name: Install deps
        working-directory: capri-fe
        run: npm ci

      - name: Build frontend
        working-directory: capri-fe
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: capri-fe-dist
          path: capri-fe/dist

  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # internal/server/web/dist 被 .gitignore 忽略、不在仓库里，
      # 必须先把前端构建产物放进去，go:embed web/dist 才能编译。
      - name: Install frontend dist into embed dir
        uses: actions/download-artifact@v7
        with:
          name: capri-fe-dist
          path: internal/server/web/dist

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build capri-host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          gui=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
            # Windows 版是双击运行的：不带 -H=windowsgui 的二进制是 console
            # 子系统，Explorer 会替它开一个终端窗口，而托盘存在的前提正是
            # 没有那个窗口。同时它让 stderr 失效，所以日志走 logs/host.log。
            gui=" -H=windowsgui"
          fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w${gui} -X github.com/AgentsHarness/capri-host/internal/acp.Version=${GITHUB_REF_NAME}" -o "dist/capri-host-${GOOS}-${GOARCH}${ext}" ./cmd/capri-host

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: capri-host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/capri-host-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 只下载编译出的二进制，不要包含前端 dist（capri-fe-dist）
      # merge-multiple 让它们平铺到 dist/，再整体上传。
      - name: Download compiled binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: capri-host-*
          merge-multiple: true

      - name: Show built files
        run: find dist -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: capri-host ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
